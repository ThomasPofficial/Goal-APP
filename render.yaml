services:
  - type: web
    name: nivarro
    env: node
    buildCommand: npm install; npm run build
    startCommand: node scripts/start.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXT_PUBLIC_AUTH_URL
        value: https://nivarro.co
      - key: AUTH_URL
        value: https://nivarro.co
</content>
</invoke>